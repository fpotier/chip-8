repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust
        language: system
        entry: cargo fmt -- --check
        pass_filenames: false
      - id: cargo-clippy
        name: Lint Rust
        language: system
        entry: cargo clippy --all-targets -- -Dwarnings
        pass_filenames: false
