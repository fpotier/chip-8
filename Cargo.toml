[package]
name = "chip-8"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/fpotier/chip-8"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
bmp = "0.5.0"
fastrand = "2.3.0"
url = "2.5.4"
reqwest = { version = "0.12.21", default-features = true, features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.88"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
egui_extras = { version = "0.31", default-features = false }
egui-notify = "0.19.0"
rfd = { version = "0.15.3", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
tokio = { version = "1.45.1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3.77"           # to access the DOM (to hide the loading text)
wasm-logger = "0.2.0"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
